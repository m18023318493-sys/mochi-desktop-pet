name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Tkinter on Windows
        if: runner.os == 'Windows'
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile activity_core.py avatar_core.py pet_core.py mochi_pet.py
      - run: python -m mochi_pet --version
